name: system_health_scan
version: "1.0"
description: Real-Time Host System Health & Security Inspection Playbook
trigger:
  keywords: [attack, system, check, status, scan, clean, host, machine, security]
nodes:
  - id: check_system_sockets
    type: siem_query
    name: Check Active Network Sockets
    query_template: "List active network listening sockets and established remote IPs"

  - id: check_windows_event_log
    type: siem_query
    name: Check Windows Security Event Stream
    query_template: "Scan Windows Event Log for failed logon events 4625"
    depends_on: [check_system_sockets]

  - id: analyze_system_health
    type: generate_finding
    name: System Health Risk Assessment
    depends_on: [check_windows_event_log]
    finding_template: "Real System Health Inspection executed on host DESKTOP-RLQO2MQ. Scanned active network sockets and Windows Security Log streams. Status: BENIGN / CLEAN. No active malicious attack detected."
    severity: LOW
    risk_score: 15.0
