# ─────────────────────────────────────────────────────────────────────────────
# SIEM Assistant — Kubernetes Deployment Manifest
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Namespace
metadata:
  name: siem-assistant
---
# Secret
apiVersion: v1
kind: Secret
metadata:
  name: siem-secrets
  namespace: siem-assistant
type: Opaque
stringData:
  secret-key: "change-me-in-production"
  postgres-password: "siem_secret"
  redis-password: "redis_secret"
  openai-api-key: ""
  virustotal-api-key: ""
  abuseipdb-api-key: ""
---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: siem-config
  namespace: siem-assistant
data:
  SIEM_PLATFORM: "mock"
  USE_MOCK_DATA: "true"
  LOG_LEVEL: "INFO"
  ALLOWED_ORIGINS: "http://localhost:3000"
  DEMO_ANALYST_USERNAME: "analyst"
  DEMO_ANALYST_PASSWORD: "analyst123"
  DEMO_MANAGER_USERNAME: "manager"
  DEMO_MANAGER_PASSWORD: "manager123"
---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: siem-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: siem
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: siem-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: siemdb
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: siem-assistant
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: siem-assistant
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: siem-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: siem-secrets
                  key: redis-password
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: siem-assistant
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: siem-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: siem-assistant-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: siem-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: siem-secrets
                  key: secret-key
            - name: DATABASE_URL
              value: postgresql+asyncpg://siem:$(POSTGRES_PASSWORD)@postgres:5432/siemdb
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379/0
            - name: CELERY_BROKER_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379/1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: siem-secrets
                  key: openai-api-key
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: siem-assistant
spec:
  selector:
    app: backend
  ports:
    - port: 8000
---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: siem-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: siem-assistant-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: siem-assistant
spec:
  selector:
    app: frontend
  ports:
    - port: 80
---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: siem-ingress
  namespace: siem-assistant
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  rules:
    - host: siem-assistant.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
